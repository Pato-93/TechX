<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TechX</title>

<style>

body{margin:0;background:#e9e9e9;font-family:Segoe UI,Arial,sans-serif}
.app{max-width:430px;margin:0 auto;background:#f4f4f4;min-height:100vh}
.header{background:white;padding:16px}
.good{font-size:14px;font-weight:700}
.blue{color:#0078D7}
.welcome{font-size:18px;font-weight:700;margin-top:12px}
.powered{margin-top:12px;font-size:12px;font-style:italic}
.line{height:3px;background:#0078D7}
.content{padding:12px}
.card{background:white;border:2px solid #26465A;border-radius:22px;margin-bottom:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.card:hover{background:#fafafa}
.left{display:flex;align-items:center}
.icon{font-size:24px;width:36px;margin-right:12px}
.title{font-size:16px;font-weight:700}
.desc{font-size:11px;color:#555;margin-top:3px}
.arrow{font-size:26px;color:#0078D7;font-weight:bold}
.footer{font-size:10px;color:green;padding:8px}

#findAssetPage{
display:none;
padding:15px;
}

.searchCard{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.input{
width:100%;
box-sizing:border-box;
padding:12px;
border-radius:12px;
border:1px solid #ccc;
margin-bottom:10px;
font-size:14px;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#0078D7;
color:white;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}

.btnQR{
background:#00a651;
}

.btnBack{
background:#666;
}

.historyItem{
padding:10px;
border-bottom:1px solid #eee;
font-size:12px;
}

video{
width:100%;
border-radius:15px;
display:none;
margin-top:10px;
}

</style>
</head>

<body>

<div class="app">

<div id="homePage">

<div class="header">

<div class="good">
Good Evening <span class="blue">, Chris!</span>
</div>

<div class="welcome">
Welcome to IAC Group
</div>

<div class="powered">
Powered by TechX
</div>

</div>

<div class="line"></div>

<div class="content">

<div class="card" onclick="openFindAsset()">
<div class="left">
<div class="icon">📁</div>
<div>
<div class="title">Find Asset</div>
<div class="desc">Assets Uploaded Into TechX</div>
</div>
</div>
<div class="arrow">›</div>
</div>

<div class="card">
<div class="left">
<div class="icon">📋</div>
<div>
<div class="title">Work Orders</div>
<div class="desc">Create, Assign or Complete Work Orders</div>
</div>
</div>
<div class="arrow">›</div>
</div>

<div class="card">
<div class="left">
<div class="icon">🔎</div>
<div>
<div class="title">TechX Assist</div>
<div class="desc">Troubleshooting and Parts Lookup</div>
</div>
</div>
<div class="arrow">›</div>
</div>

</div>

</div>

<div id="findAssetPage">

<div class="searchCard">

<h2 style="color:#0078D7">🔍 Find Asset</h2>

<input class="input" id="assetName" placeholder="Asset Name">

<input class="input" id="serialNumber" placeholder="Serial Number">

<button class="btn" onclick="searchAsset()">
Search Asset
</button>

<button class="btn btnQR" onclick="startCamera()">
📷 Asset Search QR Code
</button>

<video id="video" autoplay playsinline></video>

<input class="input" id="manualQR" placeholder="Enter QR Code">

<button class="btn" onclick="searchQR()">
Search QR
</button>

<button class="btn btnBack" onclick="goHome()">
⬅ Back
</button>

</div>

<div class="searchCard">

<h3>🕒 Search History</h3>

<div id="historyList"></div>

</div>

</div>

<div class="footer">
IAC Group Internal
</div>

</div>

<script>

loadHistory();

function openFindAsset(){
document.getElementById("homePage").style.display="none";
document.getElementById("findAssetPage").style.display="block";
}

function goHome(){
document.getElementById("findAssetPage").style.display="none";
document.getElementById("homePage").style.display="block";
}

function saveHistory(text){

let history=JSON.parse(localStorage.getItem("TechXHistory")||"[]");

history.unshift(
new Date().toLocaleString()+" - "+text
);

history=history.slice(0,15);

localStorage.setItem(
"TechXHistory",
JSON.stringify(history)
);

loadHistory();

}

function loadHistory(){

let history=JSON.parse(localStorage.getItem("TechXHistory")||"[]");

let html="";

history.forEach(item=>{
html+=`<div class="historyItem">${item}</div>`;
});

document.getElementById("historyList").innerHTML=html;

}

function searchAsset(){

let asset=document.getElementById("assetName").value;
let serial=document.getElementById("serialNumber").value;

saveHistory(
"Asset:"+asset+" | Serial:"+serial
);

alert(
"Searching Asset\n\nAsset: "+asset+"\nSerial: "+serial
);

}

function searchQR(){

let qr=document.getElementById("manualQR").value;

if(qr===""){
alert("Enter a QR Code");
return;
}

saveHistory("QR:"+qr);

alert("Searching QR: "+qr);

}

async function startCamera(){

try{

const stream=
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment"
}
});

const video=
document.getElementById("video");

video.srcObject=stream;
video.style.display="block";

}
catch(e){

alert("Camera access not available");

}

}

</script>

</body>
</html>
