<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TechX Asset Search</title>

<style>

body{
margin:0;
background:#eef3f8;
font-family:'Segoe UI',sans-serif;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
font-size:28px;
font-weight:700;
color:#0078D7;
}

.subtitle{
color:#666;
margin-top:5px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ccc;
font-size:15px;
box-sizing:border-box;
margin-bottom:12px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0078D7;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#005ea8;
}

.asset-card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-top:20px;
}

.asset-card h2{
color:#0078D7;
margin-top:0;
}

.link-btn{
display:block;
background:#f3f3f3;
padding:12px;
margin-top:10px;
border-radius:12px;
text-decoration:none;
color:#333;
font-weight:600;
}

.link-btn:hover{
background:#e3e3e3;
}

.photo{
width:100%;
border-radius:15px;
margin-bottom:15px;
}

.error{
background:#ffeded;
padding:15px;
border-radius:10px;
color:#a00000;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="title">
🚀 TEST TECHX
</div>

<div class="subtitle">
Search by Asset ID, Equipment Name, Manufacturer, Project Number or QR Code
</div>

</div>

<div class="card">

<input
id="searchBox"
placeholder="Enter Asset ID, Name, Manufacturer, Project Number or QR">

<button onclick="searchAsset()">

Search Asset

</button>

</div>

<div id="result"></div>

</div>

<script>

async function searchAsset(){

let searchValue=
document.getElementById("searchBox")
.value
.toLowerCase()
.trim();

if(searchValue===""){
return;
}

try{

const response=
await fetch("assets.json");

const assets=
await response.json();

const asset=
assets.find(a=>

(a.AssetID||"").toLowerCase().includes(searchValue) ||

(a.EquipmentName||"").toLowerCase().includes(searchValue) ||

(a.Manufacturer||"").toLowerCase().includes(searchValue) ||

(a.ProjectNumber||"").toLowerCase().includes(searchValue) ||

(a.QRCode||"").toLowerCase().includes(searchValue)

);

if(!asset){

document.getElementById("result").innerHTML=
'<div class="error">Asset Not Found</div>';

return;

}

document.getElementById("result").innerHTML=`

<div class="asset-card">

<h2>${asset.EquipmentName}</h2>

<p><b>Asset ID:</b> ${asset.AssetID}</p>

<p><b>Manufacturer:</b> ${asset.Manufacturer}</p>

<p><b>Project Number:</b> ${asset.ProjectNumber}</p>

<p><b>QR Code:</b> ${asset.QRCode}</p>

${asset.Photo ? `
<a class="link-btn" href="${asset.Photo}" target="_blank">
📸 Open Photo
</a>
` : ''}

${asset.OEMManual ? `
<a class="link-btn" href="${asset.OEMManual}" target="_blank">
📘 OEM Manual
</a>
` : ''}

${asset.ElectricalSchematic ? `
<a class="link-btn" href="${asset.ElectricalSchematic}" target="_blank">
⚡ Electrical Schematic
</a>
` : ''}

${asset.PneumaticSchematic ? `
<a class="link-btn" href="${asset.PneumaticSchematic}" target="_blank">
💨 Pneumatic Schematic
</a>
` : ''}

${asset.PLCProgram ? `
<a class="link-btn" href="${asset.PLCProgram}" target="_blank">
🖥 PLC Program
</a>
` : ''}

${asset.RobotProgram ? `
<a class="link-btn" href="${asset.RobotProgram}" target="_blank">
🤖 Robot Program
</a>
` : ''}

${asset.ServoProgram ? `
<a class="link-btn" href="${asset.ServoProgram}" target="_blank">
⚙ Servo Program
</a>
` : ''}

</div>

`;

}
catch(error){

document.getElementById("result").innerHTML=
'<div class="error">Could not read assets.json</div>';

console.log(error);

}

}

</script>

</body>
</html>
