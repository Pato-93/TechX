<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TechX</title>

<style>

body{
margin:0;
background:#eef3f8;
font-family:'Segoe UI',sans-serif;
}

.app{
max-width:500px;
margin:auto;
min-height:100vh;
padding:20px;
}

.header{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.good{
font-size:14px;
font-weight:700;
}

.blue{
color:#0078D7;
}

.welcome{
font-size:22px;
font-weight:700;
margin-top:10px;
}

.powered{
font-size:13px;
color:#666;
margin-top:10px;
}

.card{
background:white;
padding:18px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
}

.card:hover{
background:#f8f8f8;
}

.left{
display:flex;
align-items:center;
}

.icon{
font-size:28px;
margin-right:15px;
}

.title{
font-size:18px;
font-weight:700;
}

.desc{
font-size:12px;
color:#666;
}

.arrow{
font-size:25px;
color:#0078D7;
}

#findAssetPage{
display:none;
}

.search-card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ccc;
font-size:15px;
box-sizing:border-box;
margin-bottom:12px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0078D7;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#005ea8;
}

.back-btn{
background:#666;
margin-top:10px;
}

.asset-card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-top:20px;
}

.asset-card h2{
color:#0078D7;
margin-top:0;
}

.link-btn{
display:block;
background:#f1f1f1;
padding:12px;
border-radius:12px;
margin-top:10px;
text-decoration:none;
color:#333;
font-weight:600;
}

.link-btn:hover{
background:#e6e6e6;
}

.error{
background:#ffeaea;
padding:15px;
border-radius:12px;
color:#cc0000;
}

.footer{
margin-top:25px;
font-size:12px;
color:green;
}

</style>
</head>

<body>

<div class="app">

<div id="homePage">

<div class="header">

<div class="good">
Good Evening <span class="blue">Chris!</span>
</div>

<div class="welcome">
Welcome to IAC Group
</div>

<div class="powered">
Powered by TechX
</div>

</div>

<div class="card" onclick="openFindAsset()">

<div class="left">

<div class="icon">
📁
</div>

<div>
<div class="title">
Find Asset
</div>

<div class="desc">
Search Asset Documents
</div>
</div>

</div>

<div class="arrow">›</div>

</div>

<div class="card">

<div class="left">

<div class="icon">
📋
</div>

<div>
<div class="title">
Work Orders
</div>

<div class="desc">
Coming Soon
</div>
</div>

</div>

<div class="arrow">›</div>

</div>

<div class="card">

<div class="left">

<div class="icon">
🔎
</div>

<div>
<div class="title">
TechX Assist
</div>

<div class="desc">
Coming Soon
</div>
</div>

</div>

<div class="arrow">›</div>

</div>

<div class="footer">
IAC Group Internal
</div>

</div>

<div id="findAssetPage">

<div class="search-card">

<h2 style="color:#0078D7">
🔍 Find Asset
</h2>

<input
id="searchBox"
placeholder="Asset ID, Equipment Name, Manufacturer, Project Number or QR Code">

<button onclick="searchAsset()">
Search Asset
</button>

<button
class="back-btn"
onclick="goHome()">
⬅ Back
</button>

</div>

<div id="result"></div>

</div>

</div>

<script>

function openFindAsset(){

document.getElementById("homePage").style.display="none";

document.getElementById("findAssetPage").style.display="block";

}

function goHome(){

document.getElementById("findAssetPage").style.display="none";

document.getElementById("homePage").style.display="block";

}

async function searchAsset(){

let searchValue=
document.getElementById("searchBox")
.value
.toLowerCase()
.trim();

if(searchValue===""){
return;
}

try{

const response=
await fetch("assets.json");

const assets=
await response.json();

const asset=
assets.find(a=>

(a.AssetID||"").toLowerCase().includes(searchValue) ||

(a.EquipmentName||"").toLowerCase().includes(searchValue) ||

(a.Manufacturer||"").toLowerCase().includes(searchValue) ||

(a.ProjectNumber||"").toLowerCase().includes(searchValue) ||

(a.QRCode||"").toLowerCase().includes(searchValue)

);

if(!asset){

document.getElementById("result").innerHTML=

'<div class="error">Asset Not Found</div>';

return;

}

document.getElementById("result").innerHTML=`

<div class="asset-card">

<h2>${asset.EquipmentName}</h2>

<p><b>Asset ID:</b> ${asset.AssetID}</p>

<p><b>Manufacturer:</b> ${asset.Manufacturer}</p>

<p><b>Project Number:</b> ${asset.ProjectNumber}</p>

<p><b>QR Code:</b> ${asset.QRCode}</p>

<a class="link-btn" href="${asset.Photo}" target="_blank">
📸 Open Photo
</a>

<a class="link-btn" href="${asset.OEMManual}" target="_blank">
📘 OEM Manual
</a>

<a class="link-btn" href="${asset.ElectricalSchematic}" target="_blank">
⚡ Electrical Schematic
</a>

<a class="link-btn" href="${asset.PneumaticSchematic}" target="_blank">
💨 Pneumatic Schematic
</a>

<a class="link-btn" href="${asset.PLCProgram}" target="_blank">
🖥 PLC Program
</a>

<a class="link-btn" href="${asset.RobotProgram}" target="_blank">
🤖 Robot Program
</a>

<a class="link-btn" href="${asset.ServoProgram}" target="_blank">
⚙ Servo Program
</a>

</div>

`;

}
catch(error){

document.getElementById("result").innerHTML=

'<div class="error">Could not read assets.json</div>';

console.log(error);

}

}

</script>

</body>
</html>
