<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechX | Find Asset</title>

<style>

body{
    margin:0;
    background:#eef3f8;
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.header{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.logo{
    color:#0078D7;
    font-size:28px;
    font-weight:700;
}

.subtitle{
    color:#666;
    margin-top:5px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.section-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #d8d8d8;
    border-radius:12px;
    font-size:15px;
}

button{
    width:100%;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.search-btn{
    background:#0078D7;
    color:white;
}

.search-btn:hover{
    background:#005ea8;
}

.qr-btn{
    background:#00a651;
    color:white;
    margin-top:10px;
}

.qr-btn:hover{
    background:#008b44;
}

.history-item{
    padding:12px;
    border-bottom:1px solid #eee;
}

.history-item:last-child{
    border-bottom:none;
}

video{
    width:100%;
    margin-top:15px;
    border-radius:15px;
    display:none;
}

.footer{
    text-align:center;
    color:#888;
    font-size:12px;
    padding:10px;
}

</style>
</head>
<body>

<div class="container">

<div class="header">
    <div class="logo">🔍 Find Asset</div>
    <div class="subtitle">
        Search by Asset Name, Serial Number or QR Code
    </div>
</div>

<div class="card">

    <div class="section-title">
        Asset Search
    </div>

    <input
        id="assetName"
        placeholder="Asset Name">

    <input
        id="serialNumber"
        placeholder="Serial Number">

    <button
        class="search-btn"
        onclick="searchAsset()">
        Search Asset
    </button>

</div>

<div class="card">

    <div class="section-title">
        QR Asset Search
    </div>

    <button
        class="qr-btn"
        onclick="openCamera()">
        📷 Scan QR Code
    </button>

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <input
        id="manualQR"
        placeholder="Enter QR Code Manually">

    <button
        class="search-btn"
        onclick="searchQR()">
        Search QR
    </button>

</div>

<div class="card">

    <div class="section-title">
        🕘 Recent Searches
    </div>

    <div id="history">
        No searches yet
    </div>

</div>

<div class="footer">
    Powered by TechX
</div>

</div>

<script>

loadHistory();

function saveHistory(text){

    let history =
    JSON.parse(localStorage.getItem("techxHistory") || "[]");

    history.unshift(
        new Date().toLocaleString() +
        " - " +
        text
    );

    history = history.slice(0,15);

    localStorage.setItem(
        "techxHistory",
        JSON.stringify(history)
    );

    loadHistory();
}

function loadHistory(){

    let history =
    JSON.parse(localStorage.getItem("techxHistory") || "[]");

    let html = "";

    if(history.length===0){
        html="No searches yet";
    }else{
        history.forEach(item=>{
            html +=
            `<div class="history-item">${item}</div>`;
        });
    }

    document.getElementById("history").innerHTML = html;
}

function searchAsset(){

    let asset =
    document.getElementById("assetName").value;

    let serial =
    document.getElementById("serialNumber").value;

    let searchText =
    "Asset: " + asset +
    " | Serial: " + serial;

    saveHistory(searchText);

    alert(
        "Searching...\n\n" +
        searchText
    );

    // Aquí conectarás SharePoint,
    // SQL, Dataverse o Power Automate.
}

function searchQR(){

    let qr =
    document.getElementById("manualQR").value;

    if(qr===""){
        alert("Enter a QR code");
        return;
    }

    saveHistory("QR: " + qr);

    alert(
        "Searching QR:\n\n" +
        qr
    );

    // Conectar búsqueda real aquí.
}

async function openCamera(){

    const video =
    document.getElementById("video");

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            }
        });

        video.srcObject = stream;
        video.style.display = "block";

    }
    catch(error){

        alert(
            "Unable to access camera."
        );

        console.log(error);

    }

}

</script>

</body>
</html>
